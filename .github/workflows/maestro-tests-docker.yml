name: Maestro Tests (Docker emulator - fallback)

# Pipeline ativa enquanto o BrowserStack não está configurado (ver
# maestro-tests.yml, comentado). Roda um emulador Android dentro de um
# container Docker (budtmo/docker-android) e executa os flows do Maestro
# contra ele.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  maestro-tests-docker:
    name: Run Maestro flows (Docker emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check APK exists
        run: |
          if [ ! -f "apk/app-debug.apk" ]; then
            echo "APK não encontrado em apk/app-debug.apk. Adicione o arquivo antes de rodar o pipeline." >&2
            exit 1
          fi

      # Necessário para o container ter acesso ao /dev/kvm com aceleração de hardware.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android emulator container
        run: |
          docker run -d \
            --name android-emulator \
            --privileged \
            --device /dev/kvm \
            -p 6080:6080 \
            -e EMULATOR_DEVICE="Samsung Galaxy S10" \
            -e WEB_VNC=false \
            -e APPIUM=false \
            -v "${{ github.workspace }}:/workspace" \
            budtmo/docker-android:emulator_13.0

      - name: Wait for emulator to boot
        run: |
          timeout 300 bash -c '
            until docker exec android-emulator adb shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; do
              echo "Aguardando emulador iniciar..."
              sleep 5
            done
          '

      - name: Install APK
        run: docker exec android-emulator adb install -r /workspace/apk/app-debug.apk

      - name: Install Maestro CLI in container
        run: docker exec android-emulator bash -c "curl -Ls 'https://get.maestro.mobile.dev' | bash"

      - name: Run Maestro flows
        run: |
          docker exec -w /workspace android-emulator bash -c \
            'echo "HOME=$HOME"; export PATH="$PATH:$HOME/.maestro/bin" && maestro test .'

      - name: Container logs (debug)
        if: always()
        run: docker logs android-emulator --tail 200

      - name: Stop container
        if: always()
        run: docker rm -f android-emulator
