name: Maestro Tests

# Roda os fluxos .yaml do Maestro em um emulador Android.
# Dispara em push/PR para main e também pode ser rodado manualmente.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  maestro-tests:
    name: Run Maestro flows
    runs-on: macos-latest # runner Apple Silicon (arm64) com aceleração de hardware nativa (HVF)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check APK exists
        run: |
          if [ ! -f "apk/app-debug.apk" ]; then
            echo "APK não encontrado em apk/app-debug.apk. Adicione o arquivo antes de rodar o pipeline." >&2
            exit 1
          fi

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Android emulator and Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: arm64-v8a # macos-latest é Apple Silicon; x86_64 não tem aceleração de hardware e não boota
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r "apk/app-debug.apk"
            "$HOME/.maestro/bin/maestro" test .

      - name: Upload Maestro test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: |
            ~/.maestro/tests
            **/*.xml
          if-no-files-found: ignore
